<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>1. 开启站点 — 港湾共享单车——员工手册（虚构）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","Microsoft JhengHei",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">港湾共享单车——员工手册（虚构）</p><nav><a href="index.html">简介</a><a href="chapter-1.html">1. 开启站点</a><a href="chapter-2.html">2. 处理报修</a><a href="chapter-3.html">3. 当日收尾</a></nav></header><main><h1>1. 开启站点</h1><p>请在开门前 15 分钟到岗，检查车桩、支付终端和车辆。</p><h2>步骤</h2><ol><li>用员工卡打开站点面板。</li><li>打开支付终端，等待绿灯亮起。</li><li>逐辆检查：轮胎、刹车、车灯。</li><li>检查不合格的车辆，标记为“待维修”。</li></ol><figure><svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160"><rect x="10" y="40" width="120" height="80" rx="10" fill="#E2E5FB" stroke="#5262D6"/><rect x="180" y="40" width="120" height="80" rx="10" fill="#E2E5FB" stroke="#5262D6"/><rect x="350" y="40" width="120" height="80" rx="10" fill="#D9F2E6" stroke="#2F855A"/><path d="M130 80H180M300 80H350" stroke="#5262D6" stroke-width="3"/><circle cx="70" cy="80" r="16" fill="#5262D6"/><circle cx="240" cy="80" r="16" fill="#5262D6"/><path d="M398 80l12 12 22-26" stroke="#2F855A" stroke-width="5" fill="none"/></svg><figcaption>图 1　解锁 → 检查 → 就绪。</figcaption></figure><h2>检查清单</h2><table><thead><tr><th>项目</th><th>正常</th><th>异常时</th></tr></thead><tbody><tr><td>支付终端</td><td>绿灯</td><td>重启一次，仍不行就联系技术支持</td></tr><tr><td>胎压</td><td>3.5 bar</td><td>打气，或标记为待维修</td></tr><tr><td>车灯</td><td>前后都亮</td><td>标记为待维修</td></tr></tbody></table><p>下一章：<a href="chapter-2.html">处理报修</a>。</p></main></body></html>
