<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>2. 处理报修 — 港湾共享单车——员工手册（虚构）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","Microsoft JhengHei",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">港湾共享单车——员工手册（虚构）</p><nav><a href="index.html">简介</a><a href="chapter-1.html">1. 开启站点</a><a href="chapter-2.html">2. 处理报修</a><a href="chapter-3.html">3. 当日收尾</a></nav></header><main><h1>2. 处理报修</h1><p>骑行者可以通过应用或在站点报告问题。每份报告都有编号。</p><h2>步骤</h2><ol><li>打开报告，阅读问题描述。</li><li>根据车桩上的编号找到对应的车辆。</li><li>如果存在安全隐患，锁定车辆并标记为“停用”。</li><li>在报告中写明处理情况，然后关闭报告。</li></ol><h2>优先级</h2><table><thead><tr><th>问题</th><th>优先级</th><th>回复时限</th></tr></thead><tbody><tr><td>刹车</td><td>高</td><td>1 小时内</td></tr><tr><td>爆胎</td><td>中</td><td>当天</td></tr><tr><td>车铃、车筐</td><td>低</td><td>3 天内</td></tr></tbody></table><p>上一章：<a href="chapter-1.html">开启站点</a>　·　下一章：<a href="chapter-3.html">当日收尾</a>。</p></main></body></html>
