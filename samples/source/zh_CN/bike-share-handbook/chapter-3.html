<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>3. 当日收尾 — 港湾共享单车——员工手册（虚构）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","Microsoft JhengHei",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">港湾共享单车——员工手册（虚构）</p><nav><a href="index.html">简介</a><a href="chapter-1.html">1. 开启站点</a><a href="chapter-2.html">2. 处理报修</a><a href="chapter-3.html">3. 当日收尾</a></nav></header><main><h1>3. 当日收尾</h1><p>最后一辆租出的车归还后，关闭站点。</p><h2>步骤</h2><ol><li>确认每个车桩上都有车辆，或显示“空”。</li><li>清点标记为待维修的车辆，记下编号。</li><li>关闭支付终端。</li><li>锁上站点面板。</li></ol><h2>每日报告</h2><ul><li>今日租借次数</li><li>标记为待维修的车辆</li><li>未处理的报修报告</li></ul><p>上一章：<a href="chapter-2.html">处理报修</a>　·　<a href="index.html">目录</a>。</p></main></body></html>
