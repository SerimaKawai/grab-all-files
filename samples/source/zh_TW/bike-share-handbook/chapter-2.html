<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>2. 處理報修通報 — 港灣共享單車－員工手冊（虛構）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","Microsoft JhengHei",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">港灣共享單車－員工手冊（虛構）</p><nav><a href="index.html">簡介</a><a href="chapter-1.html">1. 開啟站點</a><a href="chapter-2.html">2. 處理報修通報</a><a href="chapter-3.html">3. 當日收班</a></nav></header><main><h1>2. 處理報修通報</h1><p>騎乘者可透過 App 或在站點通報問題。每筆通報都有編號。</p><h2>步驟</h2><ol><li>開啟通報，閱讀問題說明。</li><li>依車柱上的車號找到該輛單車。</li><li>若有安全疑慮，請將車鎖住並標示為「停止使用」。</li><li>在通報中記錄處理內容，然後結案。</li></ol><h2>優先順序</h2><table><thead><tr><th>問題</th><th>優先順序</th><th>回覆時限</th></tr></thead><tbody><tr><td>煞車</td><td>高</td><td>1 小時內</td></tr><tr><td>爆胎</td><td>中</td><td>當天</td></tr><tr><td>車鈴、車籃</td><td>低</td><td>3 天內</td></tr></tbody></table><p>上一章：<a href="chapter-1.html">開啟站點</a>｜下一章：<a href="chapter-3.html">當日收班</a>。</p></main></body></html>
