<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>1. 開啟站點 — 港灣共享單車－員工手冊（虛構）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","Microsoft JhengHei",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">港灣共享單車－員工手冊（虛構）</p><nav><a href="index.html">簡介</a><a href="chapter-1.html">1. 開啟站點</a><a href="chapter-2.html">2. 處理報修通報</a><a href="chapter-3.html">3. 當日收班</a></nav></header><main><h1>1. 開啟站點</h1><p>請在開站前 15 分鐘到達，檢查車柱、刷卡機與單車。</p><h2>步驟</h2><ol><li>用員工卡開啟站點面板。</li><li>開啟刷卡機，等待綠燈亮起。</li><li>逐一檢查單車：輪胎、煞車、車燈。</li><li>檢查未通過的單車，標示為「待修」。</li></ol><figure><svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160"><rect x="10" y="40" width="120" height="80" rx="10" fill="#E2E5FB" stroke="#5262D6"/><rect x="180" y="40" width="120" height="80" rx="10" fill="#E2E5FB" stroke="#5262D6"/><rect x="350" y="40" width="120" height="80" rx="10" fill="#D9F2E6" stroke="#2F855A"/><path d="M130 80H180M300 80H350" stroke="#5262D6" stroke-width="3"/><circle cx="70" cy="80" r="16" fill="#5262D6"/><circle cx="240" cy="80" r="16" fill="#5262D6"/><path d="M398 80l12 12 22-26" stroke="#2F855A" stroke-width="5" fill="none"/></svg><figcaption>圖 1：開啟 → 檢查 → 就緒。</figcaption></figure><h2>檢查清單</h2><table><thead><tr><th>項目</th><th>正常狀態</th><th>異常時</th></tr></thead><tbody><tr><td>刷卡機</td><td>綠燈</td><td>重新啟動一次，仍異常則聯絡客服支援</td></tr><tr><td>胎壓</td><td>3.5 bar</td><td>打氣或標示待修</td></tr><tr><td>車燈</td><td>前後皆亮</td><td>標示待修</td></tr></tbody></table><p>下一章：<a href="chapter-2.html">處理報修通報</a>。</p></main></body></html>
