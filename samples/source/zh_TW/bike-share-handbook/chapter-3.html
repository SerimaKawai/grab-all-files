<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>3. 當日收班 — 港灣共享單車－員工手冊（虛構）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","Microsoft JhengHei",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">港灣共享單車－員工手冊（虛構）</p><nav><a href="index.html">簡介</a><a href="chapter-1.html">1. 開啟站點</a><a href="chapter-2.html">2. 處理報修通報</a><a href="chapter-3.html">3. 當日收班</a></nav></header><main><h1>3. 當日收班</h1><p>最後一輛租借單車歸還後，即可關閉站點。</p><h2>步驟</h2><ol><li>確認每個車柱都有單車，或顯示「空位」。</li><li>清點標示待修的單車，並記下車號。</li><li>關閉刷卡機。</li><li>鎖上站點面板。</li></ol><h2>當日報告</h2><ul><li>今日租借次數</li><li>標示待修的單車</li><li>未結案的報修通報</li></ul><p>上一章：<a href="chapter-2.html">處理報修通報</a>｜<a href="index.html">目錄</a>。</p></main></body></html>
