<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Harbor Night Market (fictional)</title><style>body{margin:0;font-family:Georgia,"Yu Mincho",serif;background:#fbf7f0;color:#2d2a26}.hero{background:linear-gradient(135deg,#1f4e79,#5262d6);color:#fff;padding:64px 24px;text-align:center}.hero h1{font-size:2.6rem;margin:0 0 12px;letter-spacing:.02em}.hero p{font-size:1.15rem;opacity:.9;margin:0}.wrap{max-width:960px;margin:0 auto;padding:40px 24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(31,78,121,.12);overflow:hidden}.card img{display:block;width:100%;height:140px;object-fit:cover}.card div{padding:16px}.card h2{font-size:1.15rem;margin:0 0 6px;color:#1f4e79}.badge{display:inline-block;background:#e5c27a;color:#4a4038;border-radius:999px;padding:2px 10px;font-size:.8rem;font-family:system-ui,sans-serif}.cta{display:inline-block;margin-top:28px;background:#e2672e;color:#fff;text-decoration:none;padding:12px 26px;border-radius:999px;font-family:system-ui,sans-serif}footer{text-align:center;color:#8a8178;font-size:.85rem;padding:24px}@media(max-width:720px){.cards{grid-template-columns:1fr}}</style></head><body><section class="hero"><h1>Harbor Night Market (fictional)</h1><p>Fridays at the old pier, 17:00–22:00</p><a class="cta" href="#">See the map</a></section><main class="wrap"><div class="cards"><article class="card"><img src="img/card-1.svg" alt=""><div><span class="badge">Food</span><h2>Street food</h2><p>Twenty stalls from the harbor district.</p></div></article><article class="card"><img src="img/card-2.svg" alt=""><div><span class="badge">Music</span><h2>Live music</h2><p>Local bands on the pier stage.</p></div></article><article class="card"><img src="img/card-3.svg" alt=""><div><span class="badge">Craft</span><h2>Craft corner</h2><p>Handmade goods and workshops.</p></div></article></div></main><footer>A fictional event page for the Grab All Files guide.</footer></body></html>
