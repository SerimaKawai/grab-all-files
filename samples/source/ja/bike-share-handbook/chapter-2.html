<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>2. 修理報告の対応 — ハーバー・バイクシェア スタッフ手順書（架空）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">ハーバー・バイクシェア スタッフ手順書（架空）</p><nav><a href="index.html">はじめに</a><a href="chapter-1.html">1. ステーションの開所</a><a href="chapter-2.html">2. 修理報告の対応</a><a href="chapter-3.html">3. 1日の締め</a></nav></header><main><h1>2. 修理報告の対応</h1><p>利用者はアプリやステーションから不具合を報告します。報告にはすべて番号が付きます。</p><h2>手順</h2><ol><li>報告を開き、内容を読みます。</li><li>ドックで自転車の番号を探します。</li><li>危険な状態なら施錠し、「利用停止」にします。</li><li>対応した内容を報告に書き、報告を閉じます。</li></ol><h2>優先度</h2><table><thead><tr><th>不具合</th><th>優先度</th><th>対応の目安</th></tr></thead><tbody><tr><td>ブレーキ</td><td>高</td><td>1時間以内</td></tr><tr><td>パンク</td><td>中</td><td>当日中</td></tr><tr><td>ベル・かご</td><td>低</td><td>3日以内</td></tr></tbody></table><p>前へ：<a href="chapter-1.html">ステーションの開所</a>　次へ：<a href="chapter-3.html">1日の締め</a></p></main></body></html>
