<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>3. 1日の締め — ハーバー・バイクシェア スタッフ手順書（架空）</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">ハーバー・バイクシェア スタッフ手順書（架空）</p><nav><a href="index.html">はじめに</a><a href="chapter-1.html">1. ステーションの開所</a><a href="chapter-2.html">2. 修理報告の対応</a><a href="chapter-3.html">3. 1日の締め</a></nav></header><main><h1>3. 1日の締め</h1><p>最後の貸出が戻ったら、ステーションを閉じます。</p><h2>手順</h2><ol><li>すべてのドックに自転車があるか「空き」と表示されているか確認します。</li><li>要修理の自転車の台数と番号を控えます。</li><li>決済端末の電源を切ります。</li><li>ステーションのパネルを施錠します。</li></ol><h2>日報に書くこと</h2><ul><li>本日の貸出数</li><li>要修理にした自転車</li><li>未対応の修理報告</li></ul><p>前へ：<a href="chapter-2.html">修理報告の対応</a>　<a href="index.html">目次</a></p></main></body></html>
