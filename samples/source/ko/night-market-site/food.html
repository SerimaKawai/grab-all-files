rds"><article class="card"><div><span class="badge">01</span><h2>씨브리즈 피시 앤 칩스</h2><p>주문을 받으면 신선한 흰살생선을 튀깁니다.</p></div></article><article class="card"><div><span class="badge">02</span><h2>부두 국수</h2><p>해산물 육수를 쓴 담백한 간장 국물입니다.</p></div></article><article class="card"><div><span class="badge">03</span><h2>하버 꼬치</h2><p>숯불에 굽는 꼬치 열 종류입니다.</p></div></article><article class="card"><div><span class="badge">04</span><h2>달빛 크레이프</h2><p>제철 과일을 넣은 크레이프입니다.</p></div></article><article class="card"><div><span class="badge">05</span><h2>등대 빙수</h2><p>직접 만든 시럽을 얹은 빙수입니다.</p></div></article><article class="card"><div><span class="badge">06</span><h2>하버 커피</h2><p>진하게 볶은 원두로 내린 핸드드립 커피입니다.</p></div></article></div></main><footer>Grab All Files 안내를 위해 만든 가상의 행사 사이트입니다.</footer></body></html>
