<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>하버 야시장(가상)</title><style>body{margin:0;font-family:Georgia,"Yu Mincho","Batang","SimSun","PMingLiU",serif;background:#fbf7f0;color:#2d2a26}.hero{background:linear-gradient(135deg,#1f4e79,#5262d6);color:#fff;padding:64px 24px;text-align:center}.hero h1{font-size:2.6rem;margin:0 0 12px;letter-spacing:.02em}.hero p{font-size:1.15rem;opacity:.9;margin:0}.wrap{max-width:960px;margin:0 auto;padding:40px 24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(31,78,121,.12);overflow:hidden}.card img{display:block;width:100%;height:140px;object-fit:cover}.card div{padding:16px}.card h2{font-size:1.15rem;margin:0 0 6px;color:#1f4e79}.badge{display:inline-block;background:#e5c27a;color:#4a4038;border-radius:999px;padding:2px 10px;font-size:.8rem;font-family:system-ui,sans-serif}.cta{display:inline-block;margin-top:28px;background:#e2672e;color:#fff;text-decoration:none;padding:12px 26px;border-radius:999px;font-family:system-ui,sans-serif}footer{text-align:center;color:#8a8178;font-size:.85rem;padding:24px}@media(max-width:720px){.cards{grid-template-columns:1fr}}</style></head><body><section class="hero"><h1>하버 야시장(가상)</h1><p>매주 금요일, 옛 부두에서 17:00–22:00</p><a class="cta" href="#">지도 보기</a></section><main class="wrap"><div class="cards"><article class="card"><img src="img/card-1.svg" alt=""><div><span class="badge">음식</span><h2>길거리 음식</h2><p>항구 지구의 노점 스무 곳이 나옵니다.</p></div></article><article class="card"><img src="img/card-2.svg" alt=""><div><span class="badge">음악</span><h2>라이브 음악</h2><p>지역 밴드가 부두 무대에서 연주합니다.</p></div></article><article class="card"><img src="img/card-3.svg" alt=""><div><span class="badge">공예</span><h2>공예 코너</h2><p>수공예품과 체험 공방이 있습니다.</p></div></article></div></main><footer>Grab All Files 안내를 위해 만든 가상의 행사 페이지입니다.</footer></body></html>
