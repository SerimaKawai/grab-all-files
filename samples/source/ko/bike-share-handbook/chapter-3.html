<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>3. 하루 마감 — 하버 자전거 공유 — 직원 안내서(가상)</title><style>body{font-family:system-ui,"Segoe UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","Microsoft JhengHei",sans-serif;max-width:860px;margin:32px auto;padding:0 20px;line-height:1.75;color:#1f2933}header{border-bottom:1px solid #d9e2ec;margin-bottom:24px}nav a{margin-right:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bcccdc;padding:8px 10px;text-align:left}th{background:#f0f4f8}.note{color:#52606d;font-size:.92rem}figure{margin:20px 0}figcaption{color:#52606d;font-size:.9rem}</style></head><body><header><p class="note">하버 자전거 공유 — 직원 안내서(가상)</p><nav><a href="index.html">소개</a><a href="chapter-1.html">1. 대여소 열기</a><a href="chapter-2.html">2. 수리 신고 처리</a><a href="chapter-3.html">3. 하루 마감</a></nav></header><main><h1>3. 하루 마감</h1><p>마지막 대여가 반납된 뒤에 대여소를 닫습니다.</p><h2>순서</h2><ol><li>모든 거치대에 자전거가 있거나 “비어 있음”으로 표시되는지 확인합니다.</li><li>수리 필요로 표시한 자전거를 세어 번호를 적어 둡니다.</li><li>결제 단말기를 끕니다.</li><li>대여소 패널을 잠급니다.</li></ol><h2>일일 보고</h2><ul><li>오늘의 대여 건수</li><li>수리 필요로 표시한 자전거</li><li>처리되지 않은 수리 신고</li></ul><p>이전: <a href="chapter-2.html">수리 신고 처리</a> · <a href="index.html">목차</a>.</p></main></body></html>
