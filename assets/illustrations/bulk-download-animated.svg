<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" fill="none">
<style>
.flow{stroke-dasharray:5 9;animation:flow 2.6s ease-out both}
.move{animation:travel 2.6s cubic-bezier(.22,.7,.3,1) both}
.second{animation-delay:.18s}.third{animation-delay:.36s}
.finish{transform-box:fill-box;transform-origin:center;animation:finish 3s ease-out both}
@keyframes flow{from{stroke-dashoffset:56;opacity:0}30%{opacity:1}to{stroke-dashoffset:0;opacity:.45}}
@keyframes travel{0%,12%{transform:translate(var(--x),var(--y));opacity:0}24%{opacity:1}72%,100%{transform:translate(0,0);opacity:1}}
@keyframes finish{0%,76%{opacity:0;transform:scale(.8)}90%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.flow,.move,.finish{animation:none!important}}
</style>
